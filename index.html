    <style>

            --warning: #f59e0b;
            --field-bg: rgba(255, 255, 255, 0.06);
            --btn-control-bg: rgba(255, 255, 255, 0.08);
        }

        :root[data-theme="light"] {
            --primary-red: #e61e32;

            --card-surface: rgba(255, 255, 255, 0.96);
            --border-subtle: rgba(0, 0, 0, 0.08);

    <script>
        /* ================= 1. LIGHTWEIGHT CANVAS ANIMATION ================= */
        (function setupAnimatedBackground() {
            const canvas = document.getElementById("stageCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let nodes = [];
            const nodeCount = 20;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener("resize", resizeCanvas);
            resizeCanvas();

            for (let i = 0; i < nodeCount; i++) {
                nodes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    radius: Math.random() * 2 + 1
                });
            }

            function renderStage() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const isDark = document.documentElement.getAttribute("data-theme") === "dark";
                const dotColor = isDark ? "rgba(230, 30, 50, 0.45)" : "rgba(37, 30, 230, 0.94)";
                const lineColor = isDark ? "rgba(255, 255, 255, 0.05)" : "rgba(0, 0, 0, 0.40)";

                nodes.forEach((n, i) => {
                    n.x += n.vx;
                    n.y += n.vy;
                    if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
                    if (n.y < 0 || n.y > canvas.height) n.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                    ctx.fillStyle = dotColor;
                    ctx.fill();

                    for (let j = i + 1; j < nodes.length; j++) {
                        const n2 = nodes[j];
                        const dist = Math.hypot(n.x - n2.x, n.y - n2.y);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(n.x, n.y);
                            ctx.lineTo(n2.x, n2.y);
                            ctx.strokeStyle = lineColor;
                            ctx.stroke();
                        }
                    }
                });
                requestAnimationFrame(renderStage);
            }
            renderStage();
        })();

        /* ================= 2. THEME SWITCHER ================= */
        (function initTheme() {
            const saved = localStorage.getItem("officer_theme") || "light";
            document.documentElement.setAttribute("data-theme", saved);
            const icon = document.getElementById("themeIcon");
            if (icon) icon.textContent = saved === "dark" ? "☀️" : "🌙";
        })();

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute("data-theme") || "light";
            const next = current === "dark" ? "light" : "dark";
            html.setAttribute("data-theme", next);
            localStorage.setItem("officer_theme", next);

            const icon = document.getElementById("themeIcon");
            if (icon) icon.textContent = next === "dark" ? "☀️" : "🌙";
        }

        /* ================= 3. STATE & HELPERS ================= */
        let html5QrCode = null;
        let isProcessing = false;
        let todayScannedCount = 0;
        let isCameraPaused = false;
        let currentFacingMode = "environment";
        let activeExamSession = "";
        let sharedAudioContext = null;

        let lastScannedCode = "";
        let lastScannedTime = 0;

        function getAudioContext() {
            if (!sharedAudioContext) {
                sharedAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (sharedAudioContext.state === "suspended") {
                sharedAudioContext.resume();
            }
            return sharedAudioContext;
        }

        function playBeep(type = "success") {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === "success") {
                    osc.frequency.setValueAtTime(1046.50, ctx.currentTime);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);
                } else if (type === "warning") {
                    osc.frequency.setValueAtTime(550, ctx.currentTime);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else {
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {
                console.log("Audio waiting gesture:", e);
            }
        }

        function triggerVibration(pattern = [100]) {
            if ("vibrate" in navigator) navigator.vibrate(pattern);
        }

        function getTodayDate() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        /* ================= 4. FIREBASE AUTH & ACTIVE EXAM SYNC ================= */
        window.addEventListener("DOMContentLoaded", () => {
            const authCheckInterval = setInterval(() => {
                if (window.firebaseAuth && window.fAuth) {
                    clearInterval(authCheckInterval);

                    window.fAuth.onAuthStateChanged(window.firebaseAuth, async (user) => {
                        if (user) {
                            await syncActiveExamConfig();
                            showWorkspace();
                        } else {
                            document.getElementById("officerAuthScreen").classList.remove("hidden");
                            document.getElementById("officerWorkspace").classList.add("hidden");
                            if (html5QrCode) {
                                html5QrCode.stop().catch(() => {});
                                html5QrCode = null;
                            }
                        }
                    });
                }
            }, 100);

            const gunInput = document.getElementById("barcodeGunInput");
            if (gunInput) {
                gunInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") {
                        const code = gunInput.value.trim();
                        if (code) {
                            processBarcodeScan(code);
                            gunInput.value = "";
                        }
                    }
                });
            }
        });

        async function syncActiveExamConfig() {
            try {
                const snap = await window.fs.getDoc(window.fs.doc(window.firebaseDB, "config", "activeExam"));
                if (snap.exists() && snap.data().currentExam) {
                    activeExamSession = snap.data().currentExam;
                    document.getElementById("officerActiveExamName").textContent = activeExamSession;
                } else {
                    activeExamSession = "";
                    document.getElementById("officerActiveExamName").textContent = "NO EXAM CONFIGURED BY ADMIN";
                }
            } catch (e) {
                console.error("Exam sync error:", e);
            }
        }

        async function handleTerminalLogin() {
            const rawId = document.getElementById("officerUserInput").value.trim().toLowerCase();
            const pass = document.getElementById("officerPassInput").value.trim();
            const msg = document.getElementById("officerLoginMsg");
            const btn = document.getElementById("officerLoginBtn");

            if (!rawId || !pass) {
                msg.textContent = "Please fill in officer ID & password.";
                return;
            }
            
            const email = rawId.includes("@") ? rawId : `${rawId}@gmail.com`;
            
            try {
                btn.disabled = true;
                btn.textContent = "VERIFYING...";
                msg.textContent = "";

                // Browser tab close korle auto-logout hobar jonno browserSessionPersistence
                await window.fAuth.setPersistence(window.firebaseAuth, window.fAuth.browserSessionPersistence);
                await window.fAuth.signInWithEmailAndPassword(window.firebaseAuth, email, pass);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = "OPEN SCANNER";
                msg.textContent = "Invalid ID or Password!";
            }
        }

        function showWorkspace() {
            document.getElementById("officerAuthScreen").classList.add("hidden");
            document.getElementById("officerWorkspace").classList.remove("hidden");
            startCamera();
        }

        async function handleTerminalLogout() {
            if (html5QrCode) {
                await html5QrCode.stop().catch(() => {});
                html5QrCode = null;
            }
            await window.fAuth.signOut(window.firebaseAuth);
        }

        /* ================= 5. CAMERA ENGINE ================= */
        async function startCamera() {
            try {
                if (html5QrCode) {
                    await html5QrCode.stop().catch(() => {});
                    html5QrCode = null;
                }
                document.getElementById("reader").innerHTML = "";
                html5QrCode = new Html5Qrcode("reader");

                const config = { 
                    fps: 15, 
                    qrbox: { width: 280, height: 180 },
                    aspectRatio: 1.333334
                };

                await html5QrCode.start(
                    { facingMode: currentFacingMode },
                    config,
                    (decodedText) => {
                        if (!isCameraPaused) {
                            processBarcodeScan(decodedText);
                        }
                    },
                    () => {}
                );

                isCameraPaused = false;
                document.getElementById("cameraPausedOverlay").classList.remove("active");
                document.getElementById("pauseBtnText").textContent = "Pause Camera";
                document.getElementById("pauseBtnIcon").textContent = "⏸️";
                document.getElementById("scannerStatusText").textContent = "SCANNER ACTIVE";
            } catch (err) {
                console.warn("Camera fallback triggered:", err);
            }
        }

        function toggleCameraPause() {
            const video = document.querySelector("#reader video");
            const overlay = document.getElementById("cameraPausedOverlay");
            const btnText = document.getElementById("pauseBtnText");
            const btnIcon = document.getElementById("pauseBtnIcon");
            const statusText = document.getElementById("scannerStatusText");

            if (!isCameraPaused) {
                isCameraPaused = true;
                if (video) video.pause();
                if (overlay) overlay.classList.add("active");
                if (btnText) btnText.textContent = "Resume Camera";
                if (btnIcon) btnIcon.textContent = "▶️";
                if (statusText) statusText.textContent = "CAMERA PAUSED";
            } else {
                isCameraPaused = false;
                if (video) video.play().catch(e => console.warn(e));
                if (overlay) overlay.classList.remove("active");
                if (btnText) btnText.textContent = "Pause Camera";
                if (btnIcon) btnIcon.textContent = "⏸️";
                if (statusText) statusText.textContent = "SCANNER ACTIVE";
            }
        }

        async function switchCameraFacingMode() {
            try {
                if (html5QrCode) {
                    await html5QrCode.stop().catch(() => {});
                    html5QrCode = null;
                }
                document.getElementById("reader").innerHTML = "";
                currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
                await startCamera();
            } catch (err) {
                console.error("Camera flip error:", err);
            }
        }

        /* ================= 6. STRICT SCANNING & ATTENDANCE RECORDING ================= */
        async function processBarcodeScan(barcode) {
            if (isProcessing) return;

            const cleanCode = String(barcode).trim().replace(/\.0$/, "");
            const now = Date.now();

            if (cleanCode === lastScannedCode && (now - lastScannedTime) < 3500) {
                return;
            }

            const card = document.getElementById("resultCard");
            const resStatus = document.getElementById("resStatus");
            const resName = document.getElementById("resName");
            const resMeta = document.getElementById("resMeta");
            const resTime = document.getElementById("resTime");

            if (!activeExamSession) {
                alert("Cannot scan: No active exam session configured in dashboard!");
                return;
            }

            isProcessing = true;
            lastScannedCode = cleanCode;
            lastScannedTime = now;

            const today = getTodayDate();
            const timeNow = getCurrentTime();

            try {
                const studentDocId = `${activeExamSession}_${cleanCode}`;
                const studentSnap = await window.fs.getDoc(window.fs.doc(window.firebaseDB, "students", studentDocId));

                if (!studentSnap.exists()) {
                    playBeep("error");
                    triggerVibration([120, 60, 120]);

                    card.className = "result-card danger-border";
                    resStatus.style.color = "var(--primary-red)";
                    resStatus.textContent = "❌ REJECTED: NOT IN THIS EXAM";
                    resName.textContent = "Barcode: " + cleanCode;
                    resMeta.textContent = `Candidate is not enrolled in "${activeExamSession}"`;
                    resTime.textContent = "Blocked";

                    setTimeout(() => { isProcessing = false; }, 1200);
                    return;
                }

                const studentData = studentSnap.data();

                const attendanceDocId = `${activeExamSession}_${today}_${cleanCode}`;
                const attRef = window.fs.doc(window.firebaseDB, "attendance", attendanceDocId);
                const attSnap = await window.fs.getDoc(attRef);

                if (attSnap.exists()) {
                    const existing = attSnap.data();
                    playBeep("warning");
                    triggerVibration([150, 80, 150]);

                    card.className = "result-card warning-border";
                    resStatus.style.color = "var(--warning)";
                    resStatus.textContent = "⚠️ ALREADY SCANNED TODAY";
                    resName.textContent = existing.name || studentData.name;
                    resMeta.textContent = `Roll: ${existing.roll || "-"} | Class: ${existing.class || "-"}`;
                    resTime.textContent = `Already marked at: ${existing.time}`;

                    setTimeout(() => { isProcessing = false; }, 1400);
                    return;
                }

                const payload = {
                    examSession: activeExamSession,
                    barcode: cleanCode,
                    name: studentData.name || "Unknown",
                    roll: studentData.roll || "-",
                    class: studentData.class || "-",
                    school: studentData.school || "-",
                    phone: studentData.phone || "",
                    date: today,
                    time: timeNow,
                    status: "Present"
                };

                await window.fs.setDoc(attRef, payload);

                playBeep("success");
                triggerVibration([100]);
                todayScannedCount++;
                document.getElementById("todayVerifiedCount").textContent = todayScannedCount;

                card.className = "result-card success-border";
                resStatus.style.color = "var(--success)";
                resStatus.textContent = "✓ VERIFIED SUCCESSFULLY";
                resName.textContent = studentData.name;
                resMeta.textContent = `Roll: ${studentData.roll} | Class: ${studentData.class}`;
                resTime.textContent = `Marked at: ${timeNow}`;

            } catch (err) {
                console.error("Scan processing error:", err);
                card.className = "result-card danger-border";
                resStatus.style.color = "var(--primary-red)";
                resStatus.textContent = "ERROR: " + err.message;
            } finally {
                setTimeout(() => { isProcessing = false; }, 1000);
            }
        }
    </script>
